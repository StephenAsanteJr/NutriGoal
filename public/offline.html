<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · NutriGoal</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Arial, sans-serif; color: #051c2c; background: #f4f6f8; }
      main { max-width: 320px; text-align: center; padding: 24px; }
      img { width: 72px; height: 72px; }
      h1 { font-family: Georgia, serif; font-weight: 400; font-size: 28px; margin: 16px 0 8px; }
      p { color: #4a5862; font-size: 14px; line-height: 1.5; }
      button { margin-top: 16px; background: #2251ff; color: #fff; border: 0; padding: 12px 20px; font-weight: 700; border-radius: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/nutrigoal-mark.png" alt="" />
      <h1>You're offline</h1>
      <p>NutriGoal needs a connection to load your build and tickets. Check your signal and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
